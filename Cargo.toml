[package]
name = "workeo"
version = "0.1.0"
edition = "2021"
description = "Workeo — recherche d'emploi multi-agents propulsée par l'IA et le web scraping"
license = "MIT"

[[bin]]
name = "workeo"
path = "src/main.rs"

[dependencies]
# Web / async
axum = { version = "0.7", features = ["multipart", "macros"] }
axum-extra = { version = "0.9", features = ["cookie"] }
tokio = { version = "1", features = ["full"] }
tower = "0.4"
tower-http = { version = "0.5", features = ["cors", "fs", "trace", "compression-gzip"] }

# Auth & sécurité
argon2 = "0.5"
jsonwebtoken = "9.3"
rand_core = { version = "0.6", features = ["getrandom"] }

# Sérialisation
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Base de données
sqlx = { version = "0.7", features = ["runtime-tokio-rustls", "sqlite", "chrono", "uuid", "json"] }
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }

# Erreurs / logs
anyhow = "1"
thiserror = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# HTTP client + scraping
reqwest = { version = "0.11", default-features = false, features = ["json", "rustls-tls", "gzip", "brotli"] }
scraper = "0.19"
regex = "1"
once_cell = "1"
quick-xml = "0.36"

# Config
dotenvy = "0.15"

# Utilitaires
async-trait = "0.1"
futures = "0.3"
mime_guess = "2"

# Analyse de CV
pdf-extract = "0.7"
zip = "0.6"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
